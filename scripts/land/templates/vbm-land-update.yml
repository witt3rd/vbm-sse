# Is this repository's pinned copy of vbm-land intact, and is a newer release out? On dispatch; weekly too when the source is public (install keeps the two lines marked weekly only then: a private source needs a secret, so a scheduled run would fail red; run it by hand: land-update --check). Read-only: it changes nothing.
# A separate workflow from the gate, so a failure here can never make the base branch "red" and trigger the watchdog: it is a visible reminder, not a gate.
# The update itself is yours: run the update-vbm-land skill (scripts/land/bin/land-update <tag>). A PUBLIC source needs no secret (it is cloned anonymously over https); only a private source needs a read token in the secret VBM_LAND_TOKEN.
# LAND_AUTO_UPDATE in scripts/land.conf (none | patch | minor; default none) lets this workflow land the update itself through the repository's own lander (a major release never):
# only then does it need to push, with a token THIS repository holds (secret VBM_LAND_PUSH_TOKEN: a push by the default workflow token does not start the push CI that defines "red"),
# a runner that has the toolchain of your Tier 1, and `permissions: contents: write` is NOT needed (the token carries the right). With none it only reports.
name: vbm-land-update
on:
  schedule:   #weekly
    - cron: '23 6 * * 1'   #weekly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VBM_LAND_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VBM_LAND_PUSH_TOKEN || github.token }}
          fetch-depth: 0
      - name: Drift check (the vendored copy is exactly its pin, and the source confirms the pin)
        run: scripts/land/bin/land-check --upstream
      - name: Is a newer release out? (reports; with LAND_AUTO_UPDATE set, lands a patch or minor update)
        run: |
          git config user.name "vbm-land-update"; git config user.email "vbm-land-update@users.noreply.github.com"
          scripts/land/bin/land-update --auto
