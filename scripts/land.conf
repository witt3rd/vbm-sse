# Landing configuration for scripts/land-direct (docs/decisions/0002-land-direct.md). The lander is a pinned copy of vbm-land (scripts/land/, scripts/land/PIN):
# this file and scripts/land.d/ are the only landing files that belong to this repository. Read from origin/main by the lander (a change cannot loosen the
# rules it is judged by). Every key: scripts/land/lib/conf.sh.
LAND_BASE=main
# Tier 1 on the rebased combination.
LAND_TEST_CMD=mise exec -- scripts/tier1.sh
# A rebase conflict only in generated files (scripts/generated-paths.txt) takes main's file and regenerates it with the gates' own --write (improvements only).
LAND_GENERATED_LIST=scripts/generated-paths.txt
LAND_REGEN_CMD=mise exec -- scripts/regen-baselines.sh
# Size budget: production lines under LeanSse/ (a `Diff-Budget: <note>` trailer waives it).
LAND_PROD_PATHS=LeanSse
LAND_BUDGET_LINES=150
LAND_CONVENTIONAL=1
# The relabel-attack suite runs in scripts/land.d/post-tier1 and may take minutes: every hook step gets the Tier 1 bound.
LAND_STEP_TIMEOUT=1800
# Gate-edit approvals (scripts/land/docs/gate-edit-approvals.md): tier1.sh and the closure baseline may only gain lines; a removed or changed line lands only on an exact-diff approval already on main (the lander's rule;
# scripts/gate-diff-improving.sh honours it for tier1.sh and for the fall of the specified-share row of the closure baseline, and for nothing else).
LAND_GATE_APPEND_ONLY=scripts/tier1.sh scripts/closure-baseline.txt

# The structural protected set (vbm-land v0.4.x): a landing that touches a path of this list is refused (exit 12) unless a one-time approval for exactly that set and diff is already on main (scripts/gate-edit-approvals.txt).
LAND_PROTECTED_LIST=scripts/protected-paths.txt
