# Landing configuration for scripts/land-direct. Land only what passes Tier 1; nothing else refuses a landing.
LAND_BASE=main
# Red main: the tier1 job of the latest push run of core.yml (an infrastructure failure is not red).
LAND_CI_WORKFLOW=core.yml
LAND_TIER1_JOB=tier1
LAND_RED_MODE=push
LAND_TEST_CMD=mise exec -- scripts/tier1.sh
LAND_STEP_TIMEOUT=1800
