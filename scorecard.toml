# The scorecard adapter of vbm-sse (the submission contract of the VBM scorecard; every key is required by its schema). The Lean specification, the proofs, the gates, the C interface, the freestanding
# native library, the WebAssembly module and the code mutants of the C interface are measured. The throughput bench is measured against two scalar comparators (docs/bench.md).
[subject]
name = "vbm-sse"
kind = "library"

[source]
globs = ["LeanSse.lean", "LeanSse/**/*.lean", "LeanSseProofs.lean", "LeanSseProofs/**/*.lean", "abi/**/*.lean"]

[trust]
c_files = ["abi/*.c", "runtime/**/*.c"]
ledger = "docs/trust-ledger.md"
entry_regex = "^### T[0-9]"

[tests]
# the vectors are generated from the reference (vbm-sse-vectors-1); the standard's own examples are theorems, not tests
generated = ["vectors/**"]
extra = []
gate_selftests = ["scripts/test_*.sh"]
entry_points = ["vbm_sse_feed", "feed", "parse"]
scenario_files = []

[proof]
sorry_pattern = '\b(sorry|admit|axiom|unsafe|implemented_by|csimp)\b'
allow_marker = "tier1-allow"
closure_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && lake build LeanSse LeanSseProofs >/dev/null 2>&1 && lake env lean --run scripts/ClosureGate.lean'
closure_regex = 'specified share ([0-9.]+)%'
closure_timeout_seconds = 900
# DECISIONS 20 of the scorecard: the share is over everything OUTSIDE the named carve-outs (floor 100); a carve-out needs its trust-ledger entry, protected files and a mass that may only shrink
carveouts = "scripts/carveouts.txt"
carveouts_protected = "scripts/protected-paths.txt"
carveouts_regex = 'carve-outs: ([0-9]+) nodes'
carveouts_baseline = "scripts/closure-baseline.txt"
axiom_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && lake build LeanSse LeanSseProofs >/dev/null 2>&1 && lake env lean --run scripts/AxiomGate.lean'
axiom_regex = 'axiom gate: [0-9]+ constants checked, ([0-9]+) offending'
axiom_timeout_seconds = 900

[bare_metal]
# the freestanding build: the C interface compiled with no libc header and no libc (abi/lean_mini.h stands in for lean.h); the symbols: the undefined symbols of the shipped freestanding native library
# (the generated C of LeanSse, abi/vbm_sse.c and runtime/rt.c linked into one object, scripts/build_native.sh, which itself fails on any): none. The wasm32 module is built by the subject's script and has no imports.
build_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && leanc -ffreestanding -nostdlib -nostdinc -c abi/vbm_sse.c -I include -I "$(lean --print-prefix)/include" -o /tmp/x.o'
symbols_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && scripts/build_native.sh /tmp/o --no-so >/dev/null 2>&1 && { nm -u /tmp/o/vbm_sse.o | sed -n "s/^ *U //p" | sort -u; echo --end-of-symbols--; }'
allowed_symbols = []
wasm_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && lake build LeanSse:static >/dev/null 2>&1 && scripts/build_wasm.sh /tmp/vbm_sse.wasm'
wasm_bytes_regex = '([0-9]+) bytes'
timeout_seconds = 900

[mutation]
comment = "//"
equivalent = "mutants-equivalent.txt"
# code mutants (the scorecard's operator swaps, seeded) of the C interface (abi/vbm_sse.c), killed by the subject's C test harness running the GENERATED vectors through the library built from the mutated file. setup builds the Lean libraries and the vectors once;
# the harness rebuilds the freestanding library with the mutated shim (exit 99: it does not build, so the mutant is not viable) and runs every vector on every cut (non-zero: killed). The probe binary is built in a private mktemp -d and runs under scripts/land/bin/run-probe
# (ulimit -c 0 plus the dumpable-clear preload, a private TMPDIR): a crashing mutant leaves no core and no crash record, and no fixed /tmp name; a missing or refusing helper fails the unmutated baseline (not measurable), never a false kill.
files = ["abi/vbm_sse.c"]
setup_cmd = 'lake build LeanSse:static vbm-sse-vectors >/dev/null 2>&1 && lake exe vbm-sse-vectors --n 3 --out ./.mutation-vectors.jsonl >/dev/null 2>&1'
kill_cmd = 'P=scripts/land/bin/run-probe; [ -x "$P" ] || exit 99; d=$(mktemp -d) && trap "rm -rf $d" EXIT; VBM_KEEP=vbm_sse_rt_live scripts/build_native.sh $d/mlib --no-so >/dev/null 2>&1 || exit 99; leanc -isystem /usr/include $(test -d /usr/include/$(uname -m)-linux-gnu && echo -isystem /usr/include/$(uname -m)-linux-gnu) -I include -o $d/abi_t tests/abi_test.c $d/mlib/libvbm_sse.a >/dev/null 2>&1 || exit 99; "$P" $d/abi_t ./.mutation-vectors.jsonl >/dev/null 2>&1'
mutants = 50
seed = 1
kill_timeout_seconds = 120
timeout_seconds = 1800

[bench]
# throughput on FIVE corpora x three chunk sizes (docs/bench.md), each corpus verified against the sha256 pinned in bench/run_bench.py before anything is measured. The PRIMARY corpus, the one the floor is judged on, is `small-events` cut into
# chunks of 4096 bytes (a stream of 30000 small chat-completion-shaped events); the other fourteen (corpus, chunk) rows (large data lines; CR LF, CR and mixed line ends; chunks of 1 and 7 bytes) are REPORTED as `corpusrow` lines, never floored,
# with two more numbers beside the subject's own: `lean-fast` (the array machine in Lean, without the C interface) and `reference` (the whole-buffer specification in Lean). The subject measured is the compiled FREESTANDING library through its C interface.
# eventsource-parser (npm) and eventsource-stream (crates.io) are the scalar comparators the floor ("within 2x of the best scalar comparator") is measured against; both are prebuilt OUTSIDE the sandbox (scorecard/comparators/build-sse.sh: network at
# build time only) into a directory the launcher mounts read-only (sandbox-bwrap.binds: the directory and `env VBM_COMPARATORS <dir>`); run-sse.sh verifies each one's sha256 against the build-time manifest and prints the pinned version and hashes
# recorded on the card. The subject and the Lean machine must find as many events as the reference on every row (a difference fails the bench); a comparator that differs is named in a `note` line.
comparators = [{ name = "eventsource-parser", scalar = true }, { name = "eventsource-stream", scalar = true }]
timeout_seconds = 1200
cmd = '''cp -a /subject /tmp/w && cd /tmp/w && scripts/build_native.sh /tmp/o --no-so >/dev/null 2>&1 &&
leanc -O2 -isystem /usr/include $(test -d /usr/include/$(uname -m)-linux-gnu && echo -isystem /usr/include/$(uname -m)-linux-gnu) -I include -o /tmp/bench_c bench/bench.c /tmp/o/libvbm_sse.a >/dev/null 2>&1 &&
lake build vbm-sse-bench >/dev/null 2>&1 &&
python3 bench/run_bench.py /tmp/bench_c .lake/build/bin/vbm-sse-bench'''

[nonvacuity]
comment = "--"
# mutants no proof can tell from the code, argued in the subject (a hyphen inside a /-! block comment: the runner knows `--` comments only)
equivalent = "nonvacuity-equivalent.txt"
files = ["LeanSse/Spec.lean", "LeanSse/Fast.lean"]
setup_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && lake build LeanSse LeanSseProofs >/dev/null 2>&1'
kill_cmd = 'lake build LeanSse >/dev/null 2>&1 || exit 99; lake build LeanSseProofs >/dev/null 2>&1'
mutants = 20
seed = 1
kill_timeout_seconds = 900
timeout_seconds = 3500

[tier1]
# git config: a fresh clone has no hooksPath, which the subject's own commit-guard self-test requires (its worktree tool sets it).
# The sandbox caps memory at 4 GB and the fast gate starts three Lean gates at once (each 2 to 4 GB: the axiom gate, the closure gate and its self-tests): all three at once are OOM-killed. A `lake` shim serialises the `lake env lean --run`
# gates (one at a time, flock) and TEST_JOBS=1 runs its test scripts one at a time; the subject's scripts/tier1.sh is run unchanged, and the extra wall seconds are part of the timed result. TIER1_ALL=1: the subject selects the tests a delta
# can affect, a card times and counts the whole gate, cold.
command = '''cp -a /subject /tmp/w && cd /tmp/w && git config core.hooksPath scripts/githooks &&
R=$(command -v lake) && mkdir /tmp/shim &&
cat > /tmp/shim/lake <<SH
#!/bin/bash
case " \$* " in *" --run "*) exec flock /tmp/lean-heavy.lock $R "\$@";; *) exec $R "\$@";; esac
SH
chmod +x /tmp/shim/lake && PATH=/tmp/shim:$PATH TEST_JOBS=1 TIER1_ALL=1 scripts/tier1.sh'''
# The WARM run (velocity.tier1_seconds_warm): what a landing costs. It runs in the same sandbox right after the cold run, on the build cache that run left in /tmp/w (and the shim in /tmp/shim). The typical change is an edit to
# a proofs file (a comment line in LeanSseProofs/Examples.lean): the fast gate selects the tests a delta can affect (scripts/tests-map.txt: LeanSseProofs/ selects none), so it runs every gate of the always-run set (forbidden constructs,
# Init-only imports, the lints, the zero-warning build, the axiom, ledger and closure gates, the trust ledger, the scrub gate) and no test script. The gates whose evidence is a test script are therefore the named warm_skips; every
# other gate must show its self-test evidence in the warm output. A change to LeanSse/ (the specification and the code) selects every test: that is the cold run's cost, shown beside it.
warm_change_cmd = 'cd /tmp/w && printf "\n-- warm-run change: a comment\n" >> LeanSseProofs/Examples.lean'
warm_command = 'cd /tmp/w && PATH=/tmp/shim:$PATH TEST_JOBS=1 scripts/tier1.sh'
warm_timeout_seconds = 900
# the ran-evidence names of the fast gate (docs/decisions/0002-ran-evidence.md; scripts/ran-gates.txt): the lines `ran: NAME: N cases` the gate prints, exactly these names
ran_names = ["zero-warning", "tests", "axiom-gate", "closure-gate", "ledger-gate", "scrub", "trust-ledger"]
warm_skips = ["vectors check", "C ABI description check", "freestanding native test", "wasm32 build test", "language bindings test", "workflow lint", "protected-set gate", "lander", "commit-on-main guard", "parallel test runner", "delta test selection", "crash-record check", "gate-diff judge", "relabel-attack suite"]
timeout_seconds = 1800
script = "scripts/tier1.sh"
gates = [
  { name = "forbidden-constructs scan", selftest = "forbidden-constructs scan: negative self-tests ok" },
  { name = "Init-only import scan", selftest = "Init-only import scan: negative self-tests ok" },
  { name = "pipefail lint", selftest = "lint-pipefail: ok" },
  { name = "proof-evaluation lint", selftest = "lint-proof-eval: self-test ok" },
  { name = "zero-warning build", selftest = "zero-warning build: negative self-test ok" },
  { name = "axiom gate", selftest = "axiom gate: negative self-test ok" },
  { name = "obligation ledger gate", selftest = "ledger gate: negative self-tests ok" },
  { name = "closure gate", selftest = "closure gate: [0-9]+ negative self-tests ok" },
  { name = "trust ledger", selftest = "trust ledger: .* [0-9]+ negative self-tests ok" },
  { name = "scrub gate", selftest = "scrub: negative self-tests ok" },
  { name = "vectors check", selftest = "^ok +scripts/test_vectors\\.sh" },
  { name = "C ABI description check", selftest = "^ok +scripts/test_abi\\.sh" },
  { name = "freestanding native test", selftest = "^ok +scripts/test_native\\.sh" },
  { name = "wasm32 build test", selftest = "^ok +scripts/test_wasm\\.sh" },
  { name = "language bindings test", selftest = "^ok +scripts/test_bindings\\.sh" },
  { name = "workflow lint", selftest = "^ok +scripts/test_lint_workflows\\.sh" },
  { name = "protected-set gate", selftest = "^ok +scripts/test_protected_set\\.sh" },
  { name = "lander", selftest = "^ok +scripts/test_land_direct\\.sh" },
  { name = "commit-on-main guard", selftest = "^ok +scripts/test_githook\\.sh" },
  { name = "parallel test runner", selftest = "^ok +scripts/test_run_parallel\\.sh" },
  { name = "delta test selection", selftest = "^ok +scripts/test_select_tests\\.sh" },
  { name = "crash-record check", selftest = "^ok +scripts/test_no_crash_record\\.sh" },
  { name = "gate-diff judge", selftest = "^ok +scripts/test_gate_diff_improving\\.sh" },
  { name = "relabel-attack suite", selftest = "^ok +scripts/test_relabel_attacks\\.sh" },
]
attack_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && git config core.hooksPath scripts/githooks && scripts/relabel-attacks.sh --no-lean'
attack_sabotage_cmd = 'cp -a /subject /tmp/w && cd /tmp/w && git config core.hooksPath scripts/githooks && scripts/relabel-attacks.sh --no-lean --sabotage'
attack_timeout_seconds = 1800

[velocity]
window_hours = 168

[floors]
# 100 is the floor of a library (the hub's rule, DECISIONS 1). vbm-sse falls short of it by exactly its trusted boundary, and the card says so: 56 expression nodes of six @[extern] shims of the pinned vbm-simd
# (findAvx2, hasAvx2, findNeon, hasNeon, ld64, ctz; docs/trust-ledger.md T13 says why each stays trusted). scripts/closure-baseline.txt holds the exact fraction (a ratchet: scripts/gate-diff-improving.sh refuses a fall of it and of this floor).
specified_share = 100
