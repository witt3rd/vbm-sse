# The Lean gates of the tool (vbm-land docs/lean-gates.md): which modules to audit. Its presence turns them on.
LAND_LEAN_AXIOM_IMPORTS="LeanSse LeanSseProofs"
LAND_LEAN_AXIOM_ROOTS="LeanSse LeanSseProofs"
LAND_LEAN_TRUST_FILES="runtime/*.c abi/*.c bindings/*/loader.* .github/workflows/*"
LAND_LEAN_TRUST_EXTERN_DIRS="LeanSse abi"
LAND_LEAN_TRUST_TOOLS="git gh mise wt flock lake leanc leanchecker nanoda node cargo"
LAND_LEAN_TRUST_KEYS_CMD='lake env lean --run scripts/ClosureGate.lean --emit | awk "\$1==\"emit\" && \$2!=\"toolchain\" { print \"module:\" \$3 }"'
LAND_LEAN_RECHECK_MODULES="LeanSse LeanSseProofs"
LAND_LEAN_LEDGER_MODULE="LeanSseProofs.Ledger"
LAND_LEAN_LEDGER_IMPORTS="LeanSse"
LAND_LEAN_LEDGER_SUBJECT="LeanSse"
LAND_LEAN_LEDGER_ENTRIES="scripts/closure-entries.txt"
LAND_LEAN_LEDGER_BRIDGES="scripts/ledger-bridges.txt"
LAND_LEAN_LEDGER_BASELINE="scripts/ledger-baseline.txt"
LAND_LEAN_LEDGER_CLAUSES="docs/spec-clauses.txt"
LAND_LEAN_LEDGER_TAGGED="1"
