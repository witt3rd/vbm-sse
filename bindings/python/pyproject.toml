# Manifest only: nothing is published (names reserved by docs/decisions/0001-vbm-sse.md). The library (libvbm_sse) is built by scripts/build_shared.sh and found by vbm_sse/loader.py.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vbm-sse"
version = "0.0.0"
description = "Verified Server-Sent Events reader (HTML Standard 9.2.5, 9.2.6): Python binding generated from the vbm-sse ABI description"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["vbm_sse"]
